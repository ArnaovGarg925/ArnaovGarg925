<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" width="250" height="48">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style></style>
  <clipPath id="c"><rect x="0" y="0" width="250" height="48" rx="24"/></clipPath>
  <rect x="0" y="0" width="250" height="48" rx="24" fill="#0A66C2"/>
  <g clip-path="url(#c)">
    <rect y="-10" width="46" height="70" fill="#ffffff" fill-opacity="0.28" transform="skewX(-20)">
      <animate attributeName="x" values="-90;300;300" keyTimes="0;0.55;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="18" y="12" width="24" height="24" rx="5" fill="#ffffff"/>
  <text x="30" y="30" text-anchor="middle" fill="#0A66C2" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="900">in</text>
  <text x="54" y="30" fill="#ffffff" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" textLength="176" lengthAdjust="spacingAndGlyphs">Connect on LinkedIn</text>
</svg>
