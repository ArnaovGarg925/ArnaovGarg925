<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style></style>
  <text x="400" y="46" text-anchor="middle" fill="url(#g)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1">Activity</text>
  <line x1="330" y1="62" x2="470" y2="62" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="140">
    <animate attributeName="stroke-dashoffset" values="140;0;0;-140" keyTimes="0;0.4;0.7;1" dur="3.6s" repeatCount="indefinite"/>
  </line>
  <circle cy="62" r="4" fill="url(#g)">
